spring.application.name=dashboard-demo-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dashboard_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET:ZGVtb0Rhc2hib2FyZEpXVFNlY3JldERlbW9EYXNoYm9hcmRKV1RTZWNyZXRQbHVzMTIzNDU2Nzg5MA==}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
app.jwt.issuer=${APP_JWT_ISSUER:dashboard-demo-backend}
